services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: claimsense_postgres
    environment:
      POSTGRES_USER: claimsense
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: claimsensedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsense -d claimsensedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: claimsense_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: claimsense_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: claimsense
      MINIO_ROOT_PASSWORD: claimsense-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimsense_fastapi
    # Migrations must run before the app starts: the lifespan hook queries the
    # users table immediately and fails on an empty database.
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://claimsense:securepassword@postgres:5432/claimsensedb
      - REDIS_URL=redis://redis:6379/0
      # Without this, print() output sits in the buffer and `docker compose logs`
      # shows nothing until the process dies.
      - PYTHONUNBUFFERED=1
      # Object storage. Documents were previously written to a container-local
      # directory and deleted after parsing, so a finding's source page could
      # never be re-opened.
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=claimsense
      - S3_SECRET_KEY=claimsense-storage
      - S3_BUCKET=claimsense-documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimsense_worker
    command: arq worker.WorkerSettings
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://claimsense:securepassword@postgres:5432/claimsensedb
      - REDIS_URL=redis://redis:6379/0
      # Without this, print() output sits in the buffer and `docker compose logs`
      # shows nothing until the process dies.
      - PYTHONUNBUFFERED=1
      # Object storage. Documents were previously written to a container-local
      # directory and deleted after parsing, so a finding's source page could
      # never be re-opened.
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=claimsense
      - S3_SECRET_KEY=claimsense-storage
      - S3_BUCKET=claimsense-documents
      # Cap the BLAS/torch thread pools. Unbounded, embedding pins every core and
      # starves the worker's own Redis heartbeat.
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimsense_frontend
    # node_modules lives in a volume that shadows the image's copy, so it goes stale
    # as soon as package.json gains a dependency. Reconciling on boot keeps dev honest;
    # it is a fast no-op once the volume is current.
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Turbopack's build cache must NOT live on the Windows bind mount. Writing it
      # through that filesystem layer takes minutes per page; on a volume it is seconds.
      - frontend_next:/app/.next
    environment:
      # Browser-side calls go through the host-mapped port.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      # Server Components run inside the container and must use the service name.
      - API_URL_INTERNAL=http://fastapi:8000
    depends_on:
      - fastapi

volumes:
  postgres_data:
  minio_data:
  redis_data:
  hf_cache:
  frontend_node_modules:
  frontend_next:
